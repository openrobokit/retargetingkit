[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retargetingkit"
version = "0.1.0"
authors = [{ name = "RoboKit Organization", email = "jianglong.yeh@gmail.com" }]
description = "RetargetingKit maps live or recorded human motion to robot hands, arms, and humanoids."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "huggingface_hub>=0.36",
    "jaxtyping>=0.2.19",
    "numpy>=2.0",
    "pyzmq>=25.0",
    "pyyaml>=6",
    "robokit>=1.0.0rc1",
    "torch>=2.4",
    "trimesh>=4.7",
    "tyro>=1.0",
    "viser>=1.1",
    "warp-lang>=1.8",
    "yourdfpy>=0.0.56",
]

[[tool.uv.index]]
name = "torch-packages-builder"
url = "https://jianglongye.github.io/torch_packages_builder"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
xrobotoolkit-sdk = { index = "torch-packages-builder" }
manus-sdk-runtime = { index = "torch-packages-builder" }
axis-studio-sdk-runtime = { index = "torch-packages-builder" }
torch = [
    { index = "pytorch-cu126", extra = "mano", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[project.optional-dependencies]
xarm = ["xarm-python-sdk>=1.18"]
ability = ["pyserial>=3.5"]
realsense = ["pyrealsense2<2.55"] # >=2.55 breaks L515 depth stream
vision-pro = ["avp_stream>=2.51", "viser>=1.1", "warp-lang>=1.8", "yourdfpy>=0.0.56"]
retarget = ["tyro>=1.0"]
inspire = ["pyserial>=3.5", "viser>=1.1"]
manus = ["manus-sdk-runtime==0.1.0+11fe73d"]
axis = [
    "axis-studio-sdk-runtime==0.1.0+2a14818; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
pico = ["xrobotoolkit-sdk==1.0.2+c64ccf6"]
rby1 = ["rby1-sdk>=0.9.1"]
dexmate = ["dexcontrol==0.4.4", "dexcomm==0.4.2"] # 0.6.x dexcomm breaks robot discovery (mDNS); pin to working stack
vis = ["viser>=1.1", "yourdfpy>=0.0.56"]
mano = ["torch>=2.4"]
contact = ["trimesh>=4.7", "viser>=1.1", "yourdfpy>=0.0.56"]

[dependency-groups]
dev = [
    "ipython>=8",
    "ruff>=0.5",
    "pyright>=1.1.380",
    "pytest>=7.4",
    "xdoctest>=1.1",
    "coverage>=7.3",
    "pytest-cov>=4.1",
    "scipy>=1.10",  # scripts only
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
exclude = ["thirdparty", "libs", "docs"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors.
    "I",     # isort
    "F",     # Pyflakes rules.
    "UP010", # Unnecessary `from __future__ import annotations`.
    "PLC",   # Pylint convention warnings.
    "PLE",   # Pylint errors.
    "PLR",   # Pylint refactor recommendations.
    "PLW",   # Pylint warnings.
]
ignore = [
    "E731",    # Do not assign a lambda expression, use a def.
    "E741",    # Ambiguous variable name. (l, O, or I)
    "E501",    # Line too long.
    "E721",    # Do not compare types, use `isinstance()`.
    "F722",    # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",    # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "PLR2004", # Magic value used in comparison.
    "PLR0915", # Too many statements.
    "PLR0913", # Too many arguments.
    "PLR0917", # Too many positional arguments.
    "PLC0414", # Import alias does not rename variable. (this is used for exporting names)
    "PLC1901", # Use falsey strings.
    "PLC0415", # `import` should be at the top-level of a file
    "PLR5501", # Use `elif` instead of `else if`.
    "PLR0911", # Too many return statements.
    "PLR0912", # Too many branches.
    "PLW0603", # Global statement updates are discouraged.
    "PLW2901", # For loop variable overwritten.
]

[tool.ruff.lint.isort]
known-first-party = ["retargetingkit", "robokit"]
force-single-line = false
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--cov=retargetingkit --cov-report=term --durations=10"
norecursedirs = ["scripts"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src"]
reportMissingImports = "warning"
